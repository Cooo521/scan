# Androidアプリ（APK）をGitHubのコンピューターで組み立てて、ダウンロードページに置く
name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # 毎回同じ署名でアプリを作る（入れ直さずに上書きできるように）
      # 鍵は GitHub の保管場所（キャッシュ）に置いておく。最初の1回だけ新しく作る
      - name: Keep the same signing key
        id: key
        uses: actions/cache@v4
        with:
          path: ~/kantan-debug.keystore
          key: kantan-scan-keystore-v2

      - name: Make the signing key (first time only)
        if: steps.key.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v -keystore ~/kantan-debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        working-directory: android
        run: |
          export KANTAN_KEYSTORE="$HOME/kantan-debug.keystore"
          test -f "$KANTAN_KEYSTORE"
          keytool -list -v -keystore "$KANTAN_KEYSTORE" -storepass android | grep -m1 "SHA256:" || true
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log

      # 失敗したときは、組み立ての記録を build-logs という場所に置く（ログインしなくても読めるように）
      - name: Save the build log (only when it fails)
        if: failure()
        run: |
          cp build.log /tmp/build.log 2>/dev/null || echo "no log" > /tmp/build.log
          grep -nE "^e: |What went wrong|error:|ERROR|FAILURE|Could not" /tmp/build.log | head -15 | while IFS= read -r l; do echo "::error::$l"; done
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan build-logs
          git rm -rf --quiet . || true
          cp /tmp/build.log build.log
          git add build.log
          git commit -m "build log #${GITHUB_RUN_NUMBER}"
          git push -f origin build-logs

      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk kantan-scan.apk

      - name: Put it on the download page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: かんたんスキャン（Androidアプリ）
          body: |
            Pixelでこのページを開いて、下の kantan-scan.apk を押すとダウンロードできます。
            ダウンロードしたら、通知かファイルアプリから開いてインストールしてください。
          files: kantan-scan.apk
          make_latest: true
          overwrite_files: true
