# Androidアプリ（APK）をGitHubのコンピューターで組み立てて、ダウンロードページに置く
name: Android APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # 毎回同じ署名でアプリを作る（入れ直さずに上書きできるように）
      - name: Keep the same signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: kantan-scan-debug-keystore-v1

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk kantan-scan.apk

      - name: Put it on the download page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: かんたんスキャン（Androidアプリ）
          body: |
            Pixelでこのページを開いて、下の kantan-scan.apk を押すとダウンロードできます。
            ダウンロードしたら、通知かファイルアプリから開いてインストールしてください。
          files: kantan-scan.apk
          make_latest: true
          overwrite_files: true
