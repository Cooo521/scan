<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#fff7ee">
<title>かんたんスキャン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;height:100%;background:#0d0d0f;font-family:'Zen Maru Gothic','Hiragino Maru Gothic ProN',system-ui,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.screen{position:fixed;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}

/* ---------- ① 送り先を選ぶ ---------- */
#home{background:#fff7ee;color:#3b2f2f;overflow-y:auto}
.homeIn{width:100%;max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:16px;padding:26px 18px 20px}
.logoRow{display:flex;align-items:center;gap:12px}
.logo{width:52px;height:52px;border-radius:18px;background:#ffd9e2;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.logoRow h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.04em}
.logoRow p{margin:2px 0 0;font-size:14px;font-weight:500;color:#7a6253}
.kid{border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:14px}
.kid.yuri{background:#e3eeff}.kid.rio{background:#ffe8d2}
.kidHead{display:flex;align-items:center;gap:10px}
.kidHead h2{margin:0;font-size:21px;font-weight:700}
.kidHead span{font-size:12px;font-weight:500}
.yuri h2{color:#23406e}.yuri .kidHead span{color:#3f5f91}
.rio h2{color:#7a3a0c}.rio .kidHead span{color:#8e4b17}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{min-height:108px;padding:14px 4px 12px;background:#fff;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:transform .08s}
.tile:active{transform:translateY(2px)}
.yuri .tile{box-shadow:0 3px 0 #c6d9fb}.rio .tile{box-shadow:0 3px 0 #f6c9a0}
.tile .ic{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.yuri .ic{background:#cfe0ff}.rio .ic{background:#ffd7b0}
.tile b{font-size:15px;font-weight:700}
.yuri .tile b{color:#23406e}.rio .tile b{color:#7a3a0c}
.mark{background:#f1ece6;border-radius:24px;padding:14px 16px;display:flex;align-items:center;gap:12px;color:#6b5446}
.mark .ic{width:44px;height:44px;border-radius:50%;background:#e4dcd3;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.mark b{font-size:17px;font-weight:700;color:#5a473b}
.mark small{display:block;font-size:12px;font-weight:500;color:#7a6253;margin-top:2px}
.badge{margin-left:auto;font-size:12px;font-weight:700;background:#fff;color:#8a6a55;border-radius:999px;padding:5px 10px;white-space:nowrap}
.homeFoot{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;background:#fff;border-radius:999px;font-size:13px;font-weight:500;color:#6b5446}

/* ---------- ② カメラ ---------- */
#camera{background:#000;color:#fff}
.camView{position:relative;flex:1;overflow:hidden;background:#111}
#cv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cOverlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.camTop{position:absolute;left:0;right:0;top:0;padding:14px;display:flex;align-items:center;gap:10px}
.roundBtn{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.destChip{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:rgba(0,0,0,.65);font-size:14px;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.destChip i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.camHint{position:absolute;left:50%;top:76px;transform:translateX(-50%);padding:7px 14px;border-radius:999px;background:rgba(0,0,0,.7);font-size:13px;white-space:nowrap;transition:background .2s}
.camHint.ok{background:rgba(47,111,232,.85)}
.camToggles{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:0 10px}
.pill{min-height:44px;padding:0 16px;border-radius:999px;background:rgba(0,0,0,.65);font-size:13px;font-weight:500}
.pill.on{background:#4f8cff;font-weight:700}
#cFlash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#cFlash.on{opacity:.7;transition:none}
.noCam{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:#111}
.noCam p{margin:0;font-size:15px;line-height:1.7}
.noCam button{min-height:48px;padding:0 20px;border-radius:14px;background:#4f8cff;font-weight:700}
.noCam button.sub{background:#2a2d35}
.camBar{height:150px;flex:0 0 auto;background:#000;display:flex;align-items:center;justify-content:space-between;padding:10px 24px 26px}
.thumbBtn{position:relative;width:64px;height:80px}
.thumbBtn .stack{position:absolute;left:8px;top:6px;width:48px;height:64px;border-radius:5px;background:#2a2d35;border:2px solid #fff;overflow:hidden;display:flex;align-items:center;justify-content:center}
.thumbBtn img{width:100%;height:100%;object-fit:cover;display:block}
.thumbBtn .cnt{position:absolute;right:-2px;top:-4px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:#4f8cff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.thumbBtn:disabled{opacity:.35}
.shutter{position:relative;width:82px;height:82px;border-radius:50%}
.shutter svg{position:absolute;inset:0}
.shutter .core{position:absolute;inset:9px;border-radius:50%;background:#fff;transition:transform .08s}
.shutter:active .core{transform:scale(.9)}
.sendBtn{min-width:78px;min-height:58px;padding:8px 14px;border-radius:16px;background:#4f8cff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.sendBtn b{font-size:16px}.sendBtn small{font-size:11px}
.sendBtn:disabled{background:#2a2d35;color:#8b8f99}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- 一覧・枠の調整（暗い画面） ---------- */
.dark{background:#0f1115;color:#f2f3f5}
.bar{display:flex;align-items:center;gap:10px;padding:10px 14px;min-height:56px}
.bar .title{flex:1;text-align:center;font-size:16px;font-weight:700}
.btnText{padding:9px 10px;border-radius:10px;font-size:14px}
.btnPill{padding:9px 14px;border-radius:999px;background:#262a33;font-size:13px;font-weight:700}
.btnPill.on{background:#4f8cff}
#rGrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;padding:6px 14px 16px;align-content:start}
.rTile{position:relative;background:#1b1e25;border-radius:14px;overflow:hidden;aspect-ratio:3/4;display:flex;align-items:center;justify-content:center}
.rTile img{width:100%;height:100%;object-fit:contain;display:block}
.rTile .no{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.65);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
.foot{display:flex;gap:10px;padding:10px 14px 18px}
.foot button{flex:1;min-height:52px;border-radius:14px;background:#262a33;font-weight:700;font-size:15px}
.foot button.primary{background:#4f8cff;flex:1.4}
.foot button.danger{color:#ff7b7b}
#stage{position:relative;flex:1;overflow:hidden;touch-action:none;background:#000}
#eCanvas{position:absolute;left:0;top:0;touch-action:none}
#loupe{position:absolute;top:10px;width:124px;height:124px;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 18px rgba(0,0,0,.6);display:none;pointer-events:none;background:#000}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;width:max-content;max-width:92%;background:rgba(0,0,0,.72);padding:7px 14px;border-radius:14px;font-size:12px;line-height:1.5;text-align:center;pointer-events:none;transition:opacity .4s}
.tools{display:flex;gap:2px;padding:8px 6px 2px}
.tool{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:12px;font-size:11px;color:#ddd;white-space:nowrap}
.tool.on{color:#6ea2ff}
.filters{display:flex;gap:8px;padding:6px 12px;overflow-x:auto}

/* ---------- ③ 送りました ---------- */
.sentIn{width:100%;max-width:460px;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:22px;padding:80px 20px 26px}
.okCircle{width:88px;height:88px;border-radius:50%;background:#1d2b45;display:flex;align-items:center;justify-content:center;margin:0 auto}
.sentIn h1{margin:0;text-align:center;font-size:26px}
.infoCard{background:#1b1e25;border-radius:16px;padding:4px 18px}
.infoRow{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid #2a2e37;font-size:14px}
.infoRow:last-child{border-bottom:0}
.infoRow span:first-child{color:#a9afbb;flex:0 0 auto}
.infoRow span:last-child{font-weight:700;text-align:right;word-break:break-all}
.sentNote{margin:0;text-align:center;font-size:13px;line-height:1.7;color:#a9afbb}
.bigBtns{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.bigBtns button{min-height:56px;border-radius:16px;background:#262a33;font-size:16px;font-weight:700}
.bigBtns button.primary{background:#4f8cff}

/* ---------- 共通の重ね表示 ---------- */
#busy{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:50;color:#fff}
#busy.on{display:flex}
#busy .spin{width:44px;height:44px;border-width:4px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%) translateY(-12px);background:#2b2b31;color:#fff;padding:10px 16px;border-radius:12px;font-size:13.5px;opacity:0;transition:all .25s;z-index:60;pointer-events:none;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.sheetWrap{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:40}
.sheetWrap.on{display:flex}
.sheet{width:100%;max-width:520px;background:#1b1e25;color:#f2f3f5;border-radius:20px 20px 0 0;padding:18px 16px 22px;display:flex;flex-direction:column;gap:12px}
.sheet h3{margin:0;font-size:17px}
.sheet p{margin:0;font-size:14px;line-height:1.7;color:#c9ced8}
.sheet .where{background:#262a33;border-radius:12px;padding:12px 14px;font-size:15px;font-weight:700;color:#fff}
.sheet .row{display:flex;gap:10px}
.sheet .row button,.sheet>button{flex:1;min-height:52px;border-radius:14px;background:#2d313b;font-weight:700;font-size:15px}
.sheet button.primary{background:#4f8cff}
</style>
</head>
<body>

<!-- ① 送り先を選ぶ -->
<section id="home" class="screen active">
  <div class="homeIn">
    <div class="logoRow">
      <div class="logo"><svg aria-hidden="true" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#d14f74" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A2.5 2.5 0 0 1 6.5 6h1.6l1.3-2h5.2l1.3 2h1.6A2.5 2.5 0 0 1 20 8.5v8A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5z"/><circle cx="12" cy="12.5" r="3.4"/><path d="M17 9h.01"/></svg></div>
      <div><h1>かんたんスキャン</h1><p>だれの、なにを撮る？</p></div>
    </div>

    <section class="kid yuri">
      <div class="kidHead">
        <svg role="img" aria-label="佑莉" width="48" height="48" viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#fff"/><path d="M10 26c0-10 6-16 14-16s14 6 14 16v8H10z" fill="#4a3428"/><circle cx="24" cy="27" r="11" fill="#ffe3cf"/><path d="M13 23c3-6 8-8 11-8s8 2 11 8c-4-2-8-4-11-4s-7 2-11 4z" fill="#4a3428"/><circle cx="20" cy="27" r="1.6" fill="#3b2f2f"/><circle cx="28" cy="27" r="1.6" fill="#3b2f2f"/><circle cx="17.5" cy="31" r="2" fill="#ffb3c1"/><circle cx="30.5" cy="31" r="2" fill="#ffb3c1"/><path d="M21.5 31.5q2.5 2 5 0" fill="none" stroke="#3b2f2f" stroke-width="1.4" stroke-linecap="round"/></svg>
        <div><h2>佑莉</h2><span>佑莉の復習 に入ります</span></div>
      </div>
      <div class="tiles">
        <button class="tile" data-dest="yuri-print"><span class="ic"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2f5fb3" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg></span><b>塾プリント</b></button>
        <button class="tile" data-dest="yuri-text"><span class="ic"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2f5fb3" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg></span><b>テキスト</b></button>
        <button class="tile" data-dest="yuri-test"><span class="ic"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#2f5fb3" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="m9 13 2 2 4-4"/></svg></span><b>テスト</b></button>
      </div>
    </section>

    <section class="kid rio">
      <div class="kidHead">
        <svg role="img" aria-label="莉緒" width="48" height="48" viewBox="0 0 48 48"><circle cx="24" cy="24" r="24" fill="#fff"/><circle cx="10.5" cy="21" r="5.5" fill="#4a3428"/><circle cx="37.5" cy="21" r="5.5" fill="#4a3428"/><circle cx="24" cy="26" r="12" fill="#4a3428"/><circle cx="24" cy="28" r="10.5" fill="#ffe3cf"/><path d="M14 25c2-5 6-7 10-7s8 2 10 7c-3-1.5-6-2.5-10-2.5s-7 1-10 2.5z" fill="#4a3428"/><circle cx="10.5" cy="21" r="1.8" fill="#ff8fab"/><circle cx="37.5" cy="21" r="1.8" fill="#ff8fab"/><circle cx="20.2" cy="28.5" r="1.6" fill="#3b2f2f"/><circle cx="27.8" cy="28.5" r="1.6" fill="#3b2f2f"/><circle cx="17.8" cy="32" r="2" fill="#ffb3c1"/><circle cx="30.2" cy="32" r="2" fill="#ffb3c1"/><path d="M21.5 32.5q2.5 2 5 0" fill="none" stroke="#3b2f2f" stroke-width="1.4" stroke-linecap="round"/></svg>
        <div><h2>莉緒</h2><span>莉緒問題集 に入ります</span></div>
      </div>
      <div class="tiles">
        <button class="tile" data-dest="rio-book"><span class="ic"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#b5560f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg></span><b>問題集</b></button>
        <button class="tile" data-dest="rio-text"><span class="ic"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#b5560f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg></span><b>テキスト</b></button>
        <button class="tile" data-dest="rio-test"><span class="ic"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#b5560f" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="m9 13 2 2 4-4"/></svg></span><b>テスト</b></button>
      </div>
    </section>

    <div class="mark" aria-disabled="true">
      <span class="ic"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8a6a55" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg></span>
      <div><b>丸付け</b><small>あとで追加します</small></div>
      <span class="badge">じゅんび中</span>
    </div>

    <div class="homeFoot"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d14f74" stroke-width="2" stroke-linecap="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg><span id="homeFootText">ボタンを押すとカメラが起動します</span></div>
  </div>
</section>

<!-- ② カメラ -->
<section id="camera" class="screen">
  <div class="camView">
    <video id="cv" autoplay playsinline muted></video>
    <canvas id="cOverlay"></canvas>
    <div id="cFlash"></div>
    <div class="camTop">
      <button class="roundBtn" id="cBack" aria-label="送り先の選択にもどる"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
      <div class="destChip"><i id="cDot"></i><span id="cDest"></span></div>
      <span style="flex:1"></span>
      <button class="roundBtn" id="cGallery" aria-label="スマホの写真から取り込む"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-8 9"/></svg></button>
    </div>
    <div class="camHint" id="cHint">紙を画面に入れてください</div>
    <div class="camToggles">
      <button class="pill" id="cAuto" aria-pressed="false">自動撮影</button>
      <button class="pill" id="cSplit" aria-pressed="false">見開き分割</button>
      <button class="pill" id="cLight" aria-pressed="false" hidden>ライト</button>
    </div>
    <div class="noCam" id="cNoCam" hidden>
      <p>カメラを使えませんでした。<br>カメラの許可を確かめてください。</p>
      <button id="cRetry">もう一度カメラを起動</button>
      <button class="sub" id="cCamApp">カメラアプリで撮る</button>
    </div>
  </div>
  <div class="camBar">
    <button class="thumbBtn" id="cThumb" aria-label="撮ったページを見る" disabled><span class="stack" id="cStack"></span><span class="cnt" id="cCount">0</span></button>
    <button class="shutter" id="cShutter" aria-label="撮る">
      <svg width="82" height="82" viewBox="0 0 82 82" aria-hidden="true"><circle cx="41" cy="41" r="37" fill="none" stroke="#fff" stroke-width="4"/><circle id="cRing" cx="41" cy="41" r="37" fill="none" stroke="#4f8cff" stroke-width="5" stroke-linecap="round" stroke-dasharray="232.5" stroke-dashoffset="232.5" transform="rotate(-90 41 41)"/></svg>
      <span class="core"></span>
    </button>
    <button class="sendBtn" id="cSend" disabled><b>送る</b><small id="cSendN">0ページ</small></button>
  </div>
</section>

<!-- 撮ったページの一覧 -->
<section id="review" class="screen dark">
  <div class="bar"><button class="btnText" id="rBack">‹ カメラ</button><div class="title" id="rTitle">撮ったページ</div><span style="width:64px"></span></div>
  <div id="rGrid"></div>
  <div class="foot"><button id="rMore">＋ 撮りたす</button><button class="primary" id="rSend">送る</button></div>
</section>

<!-- 枠の調整 -->
<section id="edit" class="screen dark">
  <div class="bar"><button class="btnText" id="eBack">‹ もどる</button><div class="title">枠を合わせる</div><button class="btnPill" id="ePreview">仕上がりを見る</button></div>

<script>
'use strict';
/* =========================================================
   かんたんスキャン — 選んだフォルダ用に撮って、PDFにしてドライブへ
   画像の処理はすべてスマホの中で行います（外には送りません）
   ========================================================= */
const MAX_SRC = 3000;   // 元画像の長辺（px）
const MAX_OUT = 2400;   // 仕上がりの長辺（px）
const PREVIEW_OUT = 1100;
const DET = 512;        // ふち検出に使う縮小サイズ
const N_PROF = 32;      // ふちの曲がりを持つ点の数
const EDGES = {top:[0,1], right:[1,2], bottom:[3,2], left:[0,3]};   // 角: 0左上 1右上 2右下 3左下
const Q1=N_PROF/4, Q2=N_PROF/2, Q3=N_PROF*3/4;
const HANDLES = [['top',Q1],['top',Q2],['top',Q3],['bottom',Q1],['bottom',Q2],['bottom',Q3],['left',Q2],['right',Q2]];
const TENT = {top:Q1, bottom:Q1, left:Q2, right:Q2};

const $ = s => document.querySelector(s);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
function mkCanvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function ctx2d(c){ return c.getContext('2d',{willReadFrequently:true}); }
const nextFrame = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 0)));
function toBlob(c,q){ return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',q||0.88)); }

/* ---------------- 画像の読み込み ---------------- */
async function loadFile(file){
  let img;
  try { img = await createImageBitmap(file, {imageOrientation:'from-image'}); }
  catch(e){
    img = await new Promise((res,rej)=>{ const im=new Image(); const u=URL.createObjectURL(file);
      im.onload=()=>{URL.revokeObjectURL(u);res(im);}; im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('decode'));}; im.src=u; });
  }
  const iw = img.width||img.naturalWidth, ih = img.height||img.naturalHeight;
  const s = Math.min(1, MAX_SRC/Math.max(iw,ih));
  const c = mkCanvas(Math.round(iw*s), Math.round(ih*s));
  const g = c.getContext('2d'); g.imageSmoothingQuality='high'; g.drawImage(img,0,0,c.width,c.height);
  if (img.close) img.close();
  return c;
}
function imageDataOf(c){ return ctx2d(c).getImageData(0,0,c.width,c.height); }

/* ---------------- 小さな画像処理の道具 ---------------- */
function blurBox(src,w,h,r){
  const tmp=new Float32Array(w*h), out=new Float32Array(w*h), k=2*r+1;
  for(let y=0;y<h;y++){ const row=y*w; let acc=0;
    for(let x=-r;x<=r;x++) acc+=src[row+clamp(x,0,w-1)];
    for(let x=0;x<w;x++){ tmp[row+x]=acc/k; acc+=src[row+Math.min(w-1,x+r+1)]-src[row+Math.max(0,x-r)]; } }
  for(let x=0;x<w;x++){ let acc=0;
    for(let y=-r;y<=r;y++) acc+=tmp[clamp(y,0,h-1)*w+x];
    for(let y=0;y<h;y++){ out[y*w+x]=acc/k; acc+=tmp[Math.min(h-1,y+r+1)*w+x]-tmp[Math.max(0,y-r)*w+x]; } }
  return out;
}
function gradMag(A,w,h){
  const M=new Float32Array(w*h);
  for(let y=1;y<h-1;y++) for(let x=1;x<w-1;x++){ const i=y*w+x;
    const gx=(A[i-w+1]+2*A[i+1]+A[i+w+1])-(A[i-w-1]+2*A[i-1]+A[i+w-1]);
    const gy=(A[i+w-1]+2*A[i+w]+A[i+w+1])-(A[i-w-1]+2*A[i-w]+A[i-w+1]);
    M[i]=Math.sqrt(gx*gx+gy*gy)*0.25; }
  return M;
}
function dilate(m,w,h,r){
  if(r<=0) return m;
  const t=new Uint8Array(w*h), o=new Uint8Array(w*h);
  for(let y=0;y<h;y++){ const row=y*w; let last=-1e9;
    for(let x=0;x<w+r;x++){ if(x<w&&m[row+x]) last=x; const xx=x-r; if(xx>=0) t[row+xx]= (x-last<=2*r && last>=xx-r)?1:0; } }
  for(let x=0;x<w;x++){ let last=-1e9;
    for(let y=0;y<h+r;y++){ if(y<h&&t[y*w+x]) last=y; const yy=y-r; if(yy>=0) o[yy*w+x]=(y-last<=2*r && last>=yy-r)?1:0; } }
  return o;
}
function invert(m){ const o=new Uint8Array(m.length); for(let i=0;i<m.length;i++) o[i]=m[i]?0:1; return o; }
function erode(m,w,h,r){ return invert(dilate(invert(m),w,h,r)); }
function borderFlood(pass,w,h){
  const vis=new Uint8Array(w*h), st=new Int32Array(w*h); let sp=0;
  const push=i=>{ if(pass[i]&&!vis[i]){ vis[i]=1; st[sp++]=i; } };
  for(let x=0;x<w;x++){ push(x); push((h-1)*w+x); }
  for(let y=0;y<h;y++){ push(y*w); push(y*w+w-1); }
  while(sp){ const i=st[--sp], x=i%w;
    if(x>0) push(i-1); if(x<w-1) push(i+1); if(i>=w) push(i-w); if(i<w*(h-1)) push(i+w); }
  return vis;
}
function fillHoles(m,w,h){ return invert(borderFlood(invert(m),w,h)); }
function largestComp(m,w,h){
  const n=w*h, lab=new Int32Array(n), st=new Int32Array(n); let best=0,bestA=0,cur=0;
  for(let s=0;s<n;s++){ if(!m[s]||lab[s]) continue; cur++; let sp=0,a=0; st[sp++]=s; lab[s]=cur;
    while(sp){ const i=st[--sp], x=i%w; a++;
      if(x>0&&m[i-1]&&!lab[i-1]){lab[i-1]=cur;st[sp++]=i-1;}
      if(x<w-1&&m[i+1]&&!lab[i+1]){lab[i+1]=cur;st[sp++]=i+1;}
      if(i>=w&&m[i-w]&&!lab[i-w]){lab[i-w]=cur;st[sp++]=i-w;}
      if(i<n-w&&m[i+w]&&!lab[i+w]){lab[i+w]=cur;st[sp++]=i+w;} }
    if(a>bestA){bestA=a;best=cur;} }
  const out=new Uint8Array(n); if(best) for(let i=0;i<n;i++) if(lab[i]===best) out[i]=1;
  return out;
}
function countMask(m){ let a=0; for(let i=0;i<m.length;i++) a+=m[i]; return a; }
function borderTouch(m,w,h){ let t=0; for(let x=0;x<w;x++){ t+=m[x]+m[(h-1)*w+x]; } for(let y=0;y<h;y++){ t+=m[y*w]+m[y*w+w-1]; } return t/(2*(w+h)); }
function otsu(S){
  const hist=new Float64Array(256); for(let i=0;i<S.length;i++) hist[clamp(S[i]|0,0,255)]++;
  let total=S.length, sum=0; for(let t=0;t<256;t++) sum+=t*hist[t];
  let sB=0,wB=0,max=-1,th=128;
  for(let t=0;t<256;t++){ wB+=hist[t]; if(!wB) continue; const wF=total-wB; if(!wF) break; sB+=t*hist[t];
    const mB=sB/wB, mF=(sum-sB)/wF, v=wB*wF*(mB-mF)*(mB-mF); if(v>max){max=v;th=t;} }
  return th+0.5;
}

/* ---------------- 形（多角形）の道具 ---------------- */
function convexHull(P){
  P.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);
  const lo=[],up=[];
  for(const p of P){ while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for(let i=P.length-1;i>=0;i--){ const p=P[i]; while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  up.pop(); lo.pop(); return lo.concat(up);
}
function hullOfMask(m,w,h){
  const pts=[];
  for(let y=0;y<h;y++){ let l=-1,r=-1; const row=y*w; for(let x=0;x<w;x++) if(m[row+x]){ if(l<0) l=x; r=x; }
    if(l>=0){ pts.push([l,y+0.5]); pts.push([r+1,y+0.5]); } }
  return pts.length>=4 ? convexHull(pts) : [];
}
function polyArea(q){ let a=0; for(let i=0;i<q.length;i++){ const p=q[i], n=q[(i+1)%q.length]; a+=p.x*n.y-n.x*p.y; } return Math.abs(a)/2; }
function quadFromHull(H){
  const n0=H.length; if(n0<4) return null;
  const step=Math.max(1,Math.ceil(n0/64)), idx=[]; for(let i=0;i<n0;i+=step) idx.push(i);
  const n=idx.length; if(n<4) return null;
  const P=i=>H[idx[i]];
  const tri=(a,b,c)=>Math.abs((b[0]-a[0])*(c[1]-a[1])-(c[0]-a[0])*(b[1]-a[1]))*0.5;
  let best=0,res=null;
  for(let i=0;i<n;i++) for(let k=i+2;k<n;k++){
    let b1=0,j1=-1; for(let j=i+1;j<k;j++){ const a=tri(P(i),P(j),P(k)); if(a>b1){b1=a;j1=j;} }
    let b2=0,l1=-1; for(let l=k+1;l<n+i;l++){ const ll=l%n; if(ll===i) continue; const a=tri(P(i),P(k),P(ll)); if(a>b2){b2=a;l1=ll;} }
    if(j1>=0&&l1>=0&&b1+b2>best){ best=b1+b2; res=[idx[i],idx[j1],idx[k],idx[l1]]; } }
  if(!res) return null;
  // 間引く前の点で角を微調整
  const areaOf=r=>{ const q=r.map(t=>({x:H[t][0],y:H[t][1]})); return polyArea(q); };
  for(let round=0;round<2;round++) for(let c=0;c<4;c++){
    const prev=res[(c+3)%4], next=res[(c+1)%4]; let bestA=areaOf(res), bestI=res[c];
    for(let t=(prev+1)%n0; t!==next; t=(t+1)%n0){ const r2=res.slice(); r2[c]=t; const a=areaOf(r2); if(a>bestA){bestA=a;bestI=t;} }
    res[c]=bestI; }
  return orderCorners(res.map(t=>({x:H[t][0],y:H[t][1]})));
}
function orderCorners(q){
  const cx=q.reduce((s,p)=>s+p.x,0)/4, cy=q.reduce((s,p)=>s+p.y,0)/4;
  const s=q.slice().sort((a,b)=>Math.atan2(a.y-cy,a.x-cx)-Math.atan2(b.y-cy,b.x-cx));
  let k=0; for(let i=1;i<4;i++) if(s[i].x+s[i].y<s[k].x+s[k].y) k=i;
  return [s[k],s[(k+1)%4],s[(k+2)%4],s[(k+3)%4]];
}
function quadOK(q){
  let sign=0;
  for(let i=0;i<4;i++){ const a=q[i],b=q[(i+1)%4],c=q[(i+2)%4];
    const cr=(b.x-a.x)*(c.y-b.y)-(b.y-a.y)*(c.x-b.x); if(Math.abs(cr)<1e-6) return false;
    const sg=Math.sign(cr); if(!sign) sign=sg; else if(sg!==sign) return false;
    const v1x=a.x-b.x,v1y=a.y-b.y,v2x=c.x-b.x,v2y=c.y-b.y;
    const ang=Math.acos(clamp((v1x*v2x+v1y*v2y)/(Math.hypot(v1x,v1y)*Math.hypot(v2x,v2y)),-1,1))*180/Math.PI;
    if(ang<25||ang>155) return false; }
  return true;
}

/* ---------------- 曲がったふち（4辺）の表し方 ----------------
   辺ごとに「まっすぐな線（角と角を結ぶ線）からのずれ」を N_PROF+1 点で持つ */
function emptyProf(){ return new Array(N_PROF+1).fill(0); }
function edgeFrame(geom,e){ const [ia,ib]=EDGES[e]; const A=geom.c[ia], B=geom.c[ib];
  const dx=B.x-A.x, dy=B.y-A.y, L=Math.hypot(dx,dy)||1; return {A,B,L,n:{x:dy/L,y:-dx/L}}; }
function profAt(p,t){
  const f=clamp(t,0,1)*N_PROF; let i=Math.floor(f); if(i>=N_PROF) i=N_PROF-1; const s=f-i;
  const g=k=>k<0?2*p[0]-p[1]:k>N_PROF?2*p[N_PROF]-p[N_PROF-1]:p[k];
  const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);
  return 0.5*((2*p1)+(-p0+p2)*s+(2*p0-5*p1+4*p2-p3)*s*s+(-p0+3*p1-3*p2+p3)*s*s*s);
}
function edgePoint(geom,e,t){ const F=edgeFrame(geom,e), o=profAt(geom.p[e],t);
  return {x:F.A.x+(F.B.x-F.A.x)*t+F.n.x*o, y:F.A.y+(F.B.y-F.A.y)*t+F.n.y*o}; }
function edgePolyline(geom,e,m){ const a=[]; for(let i=0;i<=m;i++) a.push(edgePoint(geom,e,i/m)); return a; }
function polyLen(a){ let s=0; for(let i=1;i<a.length;i++) s+=Math.hypot(a[i].x-a[i-1].x,a[i].y-a[i-1].y); return s; }
function cloneGeom(g){ return {c:g.c.map(p=>({x:p.x,y:p.y})), p:{top:g.p.top.slice(),right:g.p.right.slice(),bottom:g.p.bottom.slice(),left:g.p.left.slice()}}; }
function fullGeom(w,h,inset){ const ix=w*(inset||0), iy=h*(inset||0);
  return {c:[{x:ix,y:iy},{x:w-ix,y:iy},{x:w-ix,y:h-iy},{x:ix,y:h-iy}], p:{top:emptyProf(),right:emptyProf(),bottom:emptyProf(),left:emptyProf()}}; }
function applyTent(prof,ic,delta,half){ for(let k=1;k<N_PROF;k++){ const wt=1-Math.abs(k-ic)/half; if(wt>0) prof[k]+=delta*wt; } }

/* ---------------- 紙のふちを自動で見つける ---------------- */
function detect(src,size,quick){
  const W0=src.width, H0=src.height, sc=Math.min(1,(size||DET)/Math.max(W0,H0));
  const w=Math.max(16,Math.round(W0*sc)), h=Math.max(16,Math.round(H0*sc));
  const c=mkCanvas(w,h), g=ctx2d(c); g.drawImage(src,0,0,w,h);
  const r=detectData(g.getImageData(0,0,w,h).data,w,h,{profiles:!quick});
  if(!r.found) return {geom:fullGeom(W0,H0,0.03),found:false};
  const inv=1/sc, geom={c:r.c.map(p=>({x:clamp(p.x*inv,0,W0),y:clamp(p.y*inv,0,H0)})), p:{}};
  for(const e in r.p) geom.p[e]=r.p[e].map(v=>v*inv);
  return {geom,found:true,score:r.score,name:r.name};
}
// 縮小した画像の画素から紙の四隅とふちの曲がりを探す（裏側の作業場所でも動く）
function detectData(d,w,h,opt){
  const n=w*h;
  let L=new Float32Array(n), C=new Float32Array(n);
  for(let i=0,j=0;i<n;i++,j+=4){ const r=d[j],gg=d[j+1],b=d[j+2];
    L[i]=0.299*r+0.587*gg+0.114*b; C[i]=Math.max(r,gg,b)-Math.min(r,gg,b); }
  L=blurBox(blurBox(L,w,h,1),w,h,2); C=blurBox(blurBox(C,w,h,1),w,h,2);
  const GL=gradMag(L,w,h), GC=gradMag(C,w,h), M=new Float32Array(n);
  for(let i=0;i<n;i++) M[i]=Math.max(GL[i],GC[i]*1.2);
  const samp=[]; for(let i=0;i<n;i+=3) samp.push(M[i]); samp.sort((a,b)=>a-b);
  const pct=p=>samp[Math.min(samp.length-1,Math.floor(p*samp.length))];
  const Tsup=Math.max(3,pct(0.86));
  const cands=[];
  // 白っぽい紙らしさ（明るくて色が薄い）
  const S=new Float32Array(n); for(let i=0;i<n;i++) S[i]=L[i]-0.9*C[i];
  const th=otsu(S), pm=new Uint8Array(n); for(let i=0;i<n;i++) pm[i]=S[i]>th?1:0;

  function addCand(mask,grow,name){
    let m=largestComp(mask,w,h); let area=countMask(m); if(area<n*0.05) return;
    m=fillHoles(m,w,h); if(grow) m=dilate(m,w,h,grow);
    area=countMask(m);
    const hull=hullOfMask(m,w,h), q=quadFromHull(hull); if(!q||!quadOK(q)) return;
    const qa=polyArea(q), frac=qa/n; if(frac<0.06||frac>0.985) return;
    const fit=Math.min(area,qa)/Math.max(area,qa);
    let sup=0,cnt=0;
    for(let s=0;s<4;s++){ const A=q[s],B=q[(s+1)%4], dx=B.x-A.x, dy=B.y-A.y, Ln=Math.hypot(dx,dy)||1, nx=dy/Ln, ny=-dx/Ln;

function renderPage(sd,page,maxOut){
  let {W,H}=outSize(page.geom,sd.width,sd.height);
  const k=Math.min(1,maxOut/Math.max(W,H)); W=Math.max(16,Math.round(W*k)); H=Math.max(16,Math.round(H*k));

/* ---------------- PDF・ZIP をつくる ---------------- */
async function buildPdf(outs){
  const te=new TextEncoder(), chunks=[], xref=[]; let pos=0;
  const add=x=>{ const b=typeof x==='string'?te.encode(x):x; chunks.push(b); pos+=b.length; };
  add('%PDF-1.4\n'); add(new Uint8Array([37,226,227,207,211,10]));
  const N=outs.length, kids=[];
  for(let i=0;i<N;i++) kids.push((3+3*i)+' 0 R');
  xref[1]=pos; add('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
  xref[2]=pos; add('2 0 obj\n<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+N+' >>\nendobj\n');
  for(let i=0;i<N;i++){
    const o=outs[i], bytes=new Uint8Array(await o.blob.arrayBuffer());
    const pw=595.28, ph=+(pw*o.h/o.w).toFixed(2), pn=3+3*i, cn=4+3*i, im=5+3*i;
    const content='q '+pw+' 0 0 '+ph+' 0 0 cm /Im0 Do Q';
    xref[pn]=pos; add(pn+' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pw+' '+ph+'] /Resources << /XObject << /Im0 '+im+' 0 R >> >> /Contents '+cn+' 0 R >>\nendobj\n');
    xref[cn]=pos; add(cn+' 0 obj\n<< /Length '+content.length+' >>\nstream\n'+content+'\nendstream\nendobj\n');
    xref[im]=pos; add(im+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+o.w+' /Height '+o.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+bytes.length+' >>\nstream\n');
    add(bytes); add('\nendstream\nendobj\n');
  }
  const total=2+3*N, xpos=pos;
  let x='xref\n0 '+(total+1)+'\n0000000000 65535 f \n';
  for(let i=1;i<=total;i++) x+=String(xref[i]).padStart(10,'0')+' 00000 n \n';
  add(x); add('trailer\n<< /Size '+(total+1)+' /Root 1 0 R >>\nstartxref\n'+xpos+'\n%%EOF\n');
  return new Blob(chunks,{type:'application/pdf'});
}
const CRC_T=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=CRC_T[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
async function buildZip(files){
  const te=new TextEncoder(), parts=[], cen=[]; let off=0;
  const now=new Date(), dt=((now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1)), dd=(((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate());
  for(const f of files){
    const data=new Uint8Array(await f.blob.arrayBuffer()), name=te.encode(f.name), crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true); lh.setUint16(8,0,true);
    lh.setUint16(10,dt,true); lh.setUint16(12,dd,true); lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true);
    lh.setUint16(26,name.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),name,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true); ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true);
    ch.setUint16(12,dt,true); ch.setUint16(14,dd,true); ch.setUint32(16,crc,true); ch.setUint32(20,data.length,true); ch.setUint32(24,data.length,true);
    ch.setUint16(28,name.length,true); ch.setUint32(42,off,true);
    cen.push(new Uint8Array(ch.buffer),name);
    off+=30+name.length+data.length;
  }
  let csize=0; for(const c of cen) csize+=c.length;
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true); end.setUint32(12,csize,true); end.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(end.buffer)],{type:'application/zip'});
}

// ふち探しは裏側の作業場所（Worker）で動かして、カメラの映像を止めない

try{

    quadFromHull,orderCorners,quadOK,emptyProf,edgeFrame,sampleM,edgeSetup,findEdgeOffset,fitLine,intersect,refineCorners,edgeProfile,detectData];
  const code = 'const N_PROF='+N_PROF+';const EDGES='+JSON.stringify(EDGES)+';const clamp=(v,a,b)=>v<a?a:v>b?b:v;\n'
    + fns.map(f=>f.toString()).join('\n')

async function startCamera(){

    if(!$('#camera').classList.contains('active')){ s.getTracks().forEach(t=>t.stop()); return; }
    Cam.stream = s; Cam.track = s.getVideoTracks()[0];
    cv.srcObject = s; try{ await cv.play(); }catch(e){}
    try{ Cam.ic = ('ImageCapture' in window) ? new ImageCapture(Cam.track) : null; }catch(e){ Cam.ic = null; }
    let caps = {}; try{ caps = Cam.track.getCapabilities ? Cam.track.getCapabilities() : {}; }catch(e){}
    $('#cLight').hidden = !caps.torch; Cam.light=false; $('#cLight').classList.remove('on');
    try{ if(caps.focusMode && caps.focusMode.indexOf('continuous')>=0) await Cam.track.applyConstraints({advanced:[{focusMode:'continuous'}]}); }catch(e){}
    Cam.raw=null; Cam.target=null; Cam.disp=null; Cam.alpha=0; Cam.armed=true; Cam.stableSince=0; Cam.inflight=false; Cam.jump=null;

function videoRect(){
  const r = cv.getBoundingClientRect(), vw = cv.videoWidth, vh = cv.videoHeight;
  const s = Math.max(r.width/vw, r.height/vh);
  return {s, ox:(r.width-vw*s)/2, oy:(r.height-vh*s)/2, w:r.width, h:r.height};
}
function setRing(p){ $('#cRing').setAttribute('stroke-dashoffset', String(232.5*(1-clamp(p,0,1)))); }
function setHint(text, ok){ const h=$('#cHint'); if(h.textContent!==text) h.textContent=text; h.classList.toggle('ok', !!ok); }
const qDist = (a,b)=>Math.max(...a.map((p,i)=>Math.hypot(p.x-b[i].x, p.y-b[i].y)));

// カメラの1コマを小さくして、裏側へふち探しを頼む
function requestDetect(){
  if(!Cam.stream || Cam.inflight) return;
  const vw = cv.videoWidth, vh = cv.videoHeight;
  if(!vw || !vh){ setTimeout(requestDetect, 150); return; }
  const s = LIVE/Math.max(vw,vh), w = Math.round(vw*s), h = Math.round(vh*s);
  if(!Cam.small || Cam.small.width!==w || Cam.small.height!==h) Cam.small = mkCanvas(w,h);
  const g = ctx2d(Cam.small); g.drawImage(cv,0,0,w,h);
  const img = g.getImageData(0,0,w,h);
  Cam.inflight = true; Cam.reqScale = s; Cam.reqAt = performance.now(); const id = ++Cam.reqId;
  if(detWorker){ detWorker.postMessage({id, buf:img.data.buffer, w, h}, [img.data.buffer]); }
  else setTimeout(()=>{ let r; try{ r = detectData(img.data,w,h,{profiles:false}); }catch(e){ r={found:false}; } onDetected(id, r); }, 0);
}
function onDetected(id, r){

  const now = performance.now(), vw = cv.videoWidth, vh = cv.videoHeight, diag = Math.hypot(vw,vh), s = Cam.reqScale;
  let move = 1;
  if(r && r.found){
    const q = r.c.map(p=>({x:p.x/s, y:p.y/s}));
    let accept = true;
    // 急に大きく飛んだ結果は、2回続いたときだけ信じる（取りちがえで枠が暴れないように）
    if(Cam.raw && qDist(q,Cam.raw)/diag > 0.18){
      if(Cam.jump && qDist(q,Cam.jump)/diag < 0.06){ Cam.jump = null; Cam.raw = null; }
      else { Cam.jump = q; accept = false; }
    } else Cam.jump = null;
    if(accept){
      if(Cam.raw){ move = qDist(q,Cam.raw)/diag;
        // 動きの速さを覚えておき、計算にかかった時間のぶん先回りして枠を描く
        const dt = Math.max(16, Cam.reqAt-Cam.rawAt), v = q.map((p,i)=>({x:(p.x-Cam.raw[i].x)/dt, y:(p.y-Cam.raw[i].y)/dt}));
        Cam.vel = Cam.vel ? Cam.vel.map((o,i)=>({x:o.x*0.4+v[i].x*0.6, y:o.y*0.4+v[i].y*0.6})) : v;
      } else Cam.vel = null;
      Cam.raw = q; Cam.rawAt = Cam.reqAt; Cam.target = q; Cam.lastSeen = now; Cam.lostAt = 0;
      if(Cam.capQuad && qDist(q,Cam.capQuad)/diag > 0.08){ Cam.armed = true; Cam.capQuad = null; }
    }
  } else {
    if(!Cam.lostAt) Cam.lostAt = now;
    if(now-Cam.lostAt > 700){ Cam.raw=null; Cam.target=null; Cam.vel=null; Cam.armed=true; Cam.capQuad=null; Cam.jump=null; }
    else if(Cam.vel) Cam.vel = Cam.vel.map(v=>({x:v.x*0.5, y:v.y*0.5}));
  }
  // 自動撮影：止まって構えたら撮る
  let prog = 0;
  if(settings.auto && Cam.raw && Cam.armed && !Cam.busy && !Cam.lostAt){
    if(move < 0.012){ if(!Cam.stableSince) Cam.stableSince = now; prog = (now-Cam.stableSince)/1100; }

  } else Cam.stableSince = 0;
  setRing(prog);
  if(!Cam.raw) setHint('紙を画面に入れてください', false);
  else if(!Cam.armed && settings.auto) setHint('撮りました。次のページへ', true);
  else setHint(settings.auto ? 'そのまま止めると自動で撮ります' : 'ふちを見つけました', true);

  setTimeout(requestDetect, Math.max(15, 70 - spent));
}
// 青い枠は毎コマ描き直して、見つかった位置へなめらかに寄せる
function drawLoop(t){
  Cam.raf = requestAnimationFrame(drawLoop);
  const dt = Cam.lastFrame ? Math.min(100, t-Cam.lastFrame) : 16; Cam.lastFrame = t;
  if(Cam.target){
    const ahead = Math.min(180, performance.now()-Cam.rawAt)*0.8;
    const goal = Cam.vel ? Cam.target.map((p,i)=>({x:p.x+Cam.vel[i].x*ahead, y:p.y+Cam.vel[i].y*ahead})) : Cam.target;
    if(!Cam.disp) Cam.disp = goal.map(p=>({x:p.x,y:p.y}));
    const k = 1-Math.exp(-dt/40);
    Cam.disp = Cam.disp.map((p,i)=>({x:p.x+(goal[i].x-p.x)*k, y:p.y+(goal[i].y-p.y)*k}));
    Cam.alpha = Math.min(1, Cam.alpha + dt/120);
  } else {
    Cam.alpha = Math.max(0, Cam.alpha - dt/180);
    if(Cam.alpha===0) Cam.disp = null;

}
function drawOverlay(){
  const dpr = window.devicePixelRatio||1, r = videoRect();
  const W = Math.round(r.w*dpr), H = Math.round(r.h*dpr);
  if(ov.width!==W || ov.height!==H){ ov.width=W; ov.height=H; }
  og.setTransform(1,0,0,1,0,0); og.clearRect(0,0,W,H);
  if(!Cam.disp || !cv.videoWidth || Cam.alpha<=0) return;
  const P = Cam.disp.map(p=>({x:(p.x*r.s+r.ox)*dpr, y:(p.y*r.s+r.oy)*dpr}));
  og.globalAlpha = Cam.alpha;
  og.beginPath(); P.forEach((p,i)=> i?og.lineTo(p.x,p.y):og.moveTo(p.x,p.y)); og.closePath();
  og.fillStyle='rgba(79,140,255,0.18)'; og.fill();
  og.lineWidth=3*dpr; og.lineJoin='round'; og.strokeStyle='#4f8cff'; og.stroke();
  og.globalAlpha = 1;

function grabFrame(){
  const vw=cv.videoWidth, vh=cv.videoHeight, s=Math.min(1, MAX_SRC/Math.max(vw,vh));

function thumbGray(c,W,H){ // 中央を W:H に切り出して小さな白黒に
  const ar=W/H, cw=c.width, ch=c.height; let sw=cw, sh=ch; if(cw/ch>ar) sw=ch*ar; else sh=cw/ar;
  const t=mkCanvas(W,H), g=ctx2d(t); g.drawImage(c,(cw-sw)/2,(ch-sh)/2,sw,sh,0,0,W,H);
  const d=g.getImageData(0,0,W,H).data, o=new Float32Array(W*H); for(let i=0;i<W*H;i++) o[i]=d[i*4]*0.3+d[i*4+1]*0.59+d[i*4+2]*0.11; return o;

function orientLike(photo, frame){

  const W=36, H=Math.max(8,Math.round(36*frame.height/frame.width)), ref=thumbGray(frame,W,H);
  let best=null, bestD=Infinity;

const Send = { file:null, count:0 };
// ドライブへ直接送る設定（Apps Script の受け取り係）。合言葉はこのスマホの中にだけ保存する
let upload = (()=>{ try{ const o=JSON.parse(localStorage.getItem('kscan.upload')||'null'); return o&&o.u&&o.k?o:null; }catch(e){ return null; } })();
const UP_URL = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/;
(function readSetupLink(){
  const m = location.hash.match(/^#setup=([A-Za-z0-9_-]+)$/);
  if(!m) return;
  history.replaceState(null, '', location.pathname);
  try{
    const o = JSON.parse(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')));
    if(!o || !UP_URL.test(o.u) || !o.k) throw new Error('bad');
    upload = {u:o.u, k:String(o.k)};
    try{ localStorage.setItem('kscan.upload', JSON.stringify(upload)); }catch(e){}
    setTimeout(testUpload, 400);
  }catch(e){ setTimeout(()=>toast('設定用のリンクが読めませんでした'), 400); }
})();
async function testUpload(){
  try{ const j = await (await fetch(upload.u)).json(); toast(j && j.ok ? 'ドライブへ直接送る設定ができました' : '設定しましたが、受け取り係から返事がありません'); }
  catch(e){ toast('設定しましたが、受け取り係につながりませんでした'); }
  syncHomeFoot();
}
function syncHomeFoot(){ $('#homeFootText').textContent = upload ? '送ると、選んだフォルダに直接入ります' : 'ボタンを押すとカメラが起動します'; }

async function prepareSend(){
  if(!state.pages.length) return;
  await busy('PDFを作っています…'); await state.queue;
  const outs = allOuts();
  if(!outs.length){ unbusy(); toast('送るページがありません'); return; }
  try{
    const d = DEST[state.dest], pdf = await buildPdf(outs);
    Send.file = new File([pdf], d.child+'_'+d.kind+'_'+stamp()+'.pdf', {type:'application/pdf'}); Send.count = outs.length;
  }catch(e){ console.error(e); unbusy(); toast('PDFを作れませんでした'); return; }
  if(upload){ await sendDirect(); return; }
  unbusy(); openShareSheet();
}
async function sendDirect(){
  await busy('ドライブに送っています…（'+Send.count+'ページ）');
  try{
    const data = await blobToB64(Send.file);
    const res = await fetch(upload.u, {method:'POST', body:JSON.stringify({key:upload.k, dest:state.dest, name:Send.file.name, data})});
    const j = await res.json();
    unbusy();
    if(j && j.ok){ finishSent('direct'); return; }
    console.warn('upload', j);
    toast(j && j.error==='key' ? '合言葉が合いません。設定用のリンクを開き直してください' : '直接送れませんでした。共有メニューから送ってください');
  }catch(e){ console.error(e); unbusy(); toast('直接送れませんでした（電波を確かめてください）。共有メニューから送れます'); }
  openShareSheet();
}
function openShareSheet(){
  const d = DEST[state.dest], canShare = !!(navigator.canShare && navigator.canShare({files:[Send.file]}));
  $('#sendTitle').textContent = canShare ? 'ドライブに送ります（'+Send.count+'ページ）' : 'PDFを保存します（'+Send.count+'ページ）';
  $('#sendWhere').textContent = d.parent+' › '+d.folder;
  $('#sendGo').textContent = canShare ? 'ドライブに送る' : 'PDFを保存';
  $('#sendMsg').textContent = canShare ? '次の画面で「ドライブ」を選び、保存先のフォルダをここにして「保存」を押してください。' : 'PDFをダウンロードします。あとで、このフォルダに入れてください。';
  $('#sendWrap').classList.add('on');
}
$('#sendCancel').onclick = ()=>$('#sendWrap').classList.remove('on');
$('#sendGo').onclick = async()=>{
  const f = Send.file; if(!f) return;
  if(navigator.canShare && navigator.canShare({files:[f]})){
    try{ await navigator.share({files:[f], title:f.name}); $('#sendWrap').classList.remove('on'); finishSent('share'); }
    catch(e){ if(e && e.name==='AbortError') toast('送るのをやめました'); else { console.error(e); toast('共有できませんでした'); } }
  } else {
    const a=document.createElement('a'); a.href=URL.createObjectURL(f); a.download=f.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),60000);
    $('#sendWrap').classList.remove('on'); finishSent('download');
  }
};
function finishSent(mode){
  const d = DEST[state.dest];
  $('#sTitle').textContent = mode==='download' ? 'PDFを保存しました' : '送りました';
  $('#sDest').textContent = d.child+' › '+d.folder;

  $('#sName').textContent = Send.file.name;
  $('#sNote').textContent = mode==='direct' ? 'フォルダに入りました。次の取り込みのときに、復習の仕組みが読み込みます'
    : mode==='download' ? 'ダウンロードしたPDFを「'+d.parent+' › '+d.folder+'」に入れてください'
    : 'ドライブで「保存」まで押せていれば完了です。次の取り込みのときに、復習の仕組みが読み込みます';
  clearBatch(); Send.file=null; updateCamBar();
  show('sent');
}

}

function evPos(ev){ const r=ec.getBoundingClientRect(), dpr=Edit.v.dpr; return {x:(ev.clientX-r.left)*dpr, y:(ev.clientY-r.top)*dpr}; }

async function refreshPreview(){ if(!Edit.preview) return; await busy('仕上がりを作っています…'); try{ Edit.preview=renderPage(editSD(),Edit.page,PREVIEW_OUT); }catch(e){ console.error(e); } unbusy(); eDraw(); }
$('#ePreview').onclick=async()=>{ if(Edit.preview){ Edit.preview=null; syncEditTools(); eDraw(); return; } Edit.preview={}; syncEditTools(); await refreshPreview(); };
$('#tAuto').onclick=async()=>{ await busy('ふちを探しています…'); const det=detect(Edit.src); Edit.page.geom=det.geom; unbusy(); toast(det.found?'ふちに合わせました':'ふちが見つかりませんでした'); if(Edit.preview) await refreshPreview(); else eDraw(); };
$('#tFull').onclick=async()=>{ Edit.page.geom=fullGeom(Edit.src.width,Edit.src.height,0); if(Edit.preview) await refreshPreview(); else eDraw(); };
$('#tFlat').onclick=async()=>{ const p=Edit.page.geom.p; for(const e in p) p[e]=emptyProf(); toast('ふちをまっすぐにしました'); if(Edit.preview) await refreshPreview(); else eDraw(); };
$('#tRot').onclick=async()=>{ Edit.page.rot=(Edit.page.rot+1)%4; syncEditTools(); if(Edit.preview) await refreshPreview(); else toast('仕上がりを右に'+(Edit.page.rot*90)+'°回します'); };
$('#tSplit').onclick=async()=>{ Edit.page.split=!Edit.page.split; Edit.page.rtl=(settings.split[state.dest]||0)===2; syncEditTools(); toast(Edit.page.split?'まん中の点線で2ページに分けます':'分けずに1ページにします'); if(Edit.preview) await refreshPreview(); else eDraw(); };
document.querySelectorAll('#eFilters [data-f]').forEach(b=>b.onclick=async()=>{ Edit.page.filter=b.dataset.f; syncEditTools(); if(Edit.preview) await refreshPreview(); });
function closeEdit(){ Edit.src=null; Edit.sd=null; Edit.disp=null; Edit.preview=null; Edit.page=null; renderReview(); updateCamBar(); show('review'); }
$('#eBack').onclick=()=>{ Object.assign(Edit.page,{geom:Edit.backup.geom,filter:Edit.backup.filter,rot:Edit.backup.rot,split:Edit.backup.split,rtl:Edit.backup.rtl}); closeEdit(); };
$('#eSave').onclick=async()=>{ const page=Edit.page, src=Edit.src; await busy('補正しています…');
  try{ await finalizePage(page,editSD(),src); }catch(e){ console.error(e); toast('補正できませんでした'); } unbusy(); closeEdit(); };
$('#eDelete').onclick=async()=>{ if(!await ask('このページを削除します。','削除')) return; const p=Edit.page; for(const o of p.outs) URL.revokeObjectURL(o.turl); state.pages=state.pages.filter(x=>x!==p);
  if(!state.pages.length){ Edit.src=null; Edit.sd=null; Edit.disp=null; Edit.page=null; updateCamBar(); show('camera'); return; } closeEdit(); };
async function openExisting(page){
  if(page.pending||!page.srcBlob){ toast('まだ処理中です。少し待ってください'); return; }
  await busy('開いています…');
  try{ const c=await loadFile(page.srcBlob); unbusy(); openEdit(page,c,'edit'); } catch(e){ console.error(e); unbusy(); toast('開けませんでした'); }
}

syncHomeFoot();
// テスト用に中の処理を外から呼べるようにしておく
window.Scan={detect,renderPage,buildPdf,loadFile,imageDataOf,state,settings,DEST,Cam};
</script>
</body>
